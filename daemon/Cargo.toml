cargo-features = ["trim-paths"]

[package]
name = "uts"
version = "0.1.0"
edition = "2021"
authors = ["FRBLanApps"]
description = "UnTrickyStore - CLI, daemon, and all runtime logic"

[[bin]]
name = "uts"
path = "src/main.rs"

[dependencies]
libc = "0.2"
gettext = "0.4"
log = "0.4"
anyhow = "1"
ureq = { version = "2", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
strip = true
debug = false
panic = "abort"
opt-level = "z"
trim-paths = "all"
incremental = false
codegen-units = 1
