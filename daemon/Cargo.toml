cargo-features = ["trim-paths"]

[package]
name = "uts"
version = "0.1.0"
edition = "2021"
authors = ["FRBLanApps"]
description = "UnTrickyStore - CLI, daemon, and all runtime logic"

[[bin]]
name = "uts"
path = "src/main.rs"

[dependencies]
libc = "0.2"
gettext = "0.4"

[profile.release]
lto = true
strip = true
debug = false
panic = "abort"
opt-level = "z"
trim-paths = "all"
incremental = false
codegen-units = 1
